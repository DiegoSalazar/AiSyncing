name: Update README

on:
  push:
    branches: [main]
    paths:
      - "data/**"

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate README from data
        run: bash scripts/generate-readme.sh

      - name: Commit if changed
        run: |
          git config user.name "AiSyncing Bot"
          git config user.email "aisyncing@noreply.github.com"
          git diff --quiet README.md && echo "No changes." && exit 0
          git add README.md
          git commit -m "docs: auto-update README from synced data"
          git push
