<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="dg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Scattered particles across banner -->
  <circle cx="20" cy="20" r="2" fill="#A78BFA" opacity="0.25"/>
  <circle cx="320" cy="12" r="2.5" fill="#818CF8" opacity="0.15"/>
  <circle cx="480" cy="105" r="2" fill="#A78BFA" opacity="0.2"/>
  <circle cx="580" cy="18" r="1.5" fill="#6C63FF" opacity="0.18"/>
  <circle cx="700" cy="95" r="2" fill="#818CF8" opacity="0.15"/>
  <circle cx="760" cy="30" r="2.5" fill="#A78BFA" opacity="0.12"/>
  <circle cx="420" cy="10" r="1.5" fill="#C4B5FD" opacity="0.2"/>
  <circle cx="650" cy="55" r="1.5" fill="#7C3AED" opacity="0.12"/>

  <!-- Neural net lines -->
  <line x1="320" y1="12" x2="420" y2="8" stroke="#A78BFA" stroke-width="0.5" opacity="0.08"/>
  <line x1="580" y1="18" x2="650" y2="55" stroke="#818CF8" stroke-width="0.5" opacity="0.06"/>
  <line x1="700" y1="95" x2="760" y2="30" stroke="#A78BFA" stroke-width="0.5" opacity="0.06"/>

  <!-- Decorative gradient line spanning the banner -->
  <rect x="0" y="117" width="800" height="3" rx="1.5" fill="url(#g)" opacity="0.15"/>

  <!-- ===== THOUGHT BUBBLE (compact) ===== -->
  <g transform="translate(30, 48) scale(0.72)">
    <!-- Trailing dots -->
    <circle cx="-30" cy="50" r="5" fill="url(#g)" opacity="0.4"/>
    <circle cx="-40" cy="65" r="3" fill="url(#g)" opacity="0.25"/>

    <!-- Cloud body -->
    <circle cx="0" cy="10" r="20" fill="white"/>
    <circle cx="22" cy="-8" r="22" fill="white"/>
    <circle cx="52" cy="-14" r="25" fill="white"/>
    <circle cx="82" cy="-8" r="20" fill="white"/>
    <circle cx="95" cy="12" r="18" fill="white"/>
    <circle cx="88" cy="30" r="16" fill="white"/>
    <circle cx="2" cy="28" r="15" fill="white"/>
    <ellipse cx="48" cy="12" rx="42" ry="24" fill="white"/>

    <!-- Cloud outline -->
    <circle cx="0" cy="10" r="20" fill="none" stroke="url(#g)" stroke-width="2"/>
    <circle cx="22" cy="-8" r="22" fill="none" stroke="url(#g)" stroke-width="2"/>
    <circle cx="52" cy="-14" r="25" fill="none" stroke="url(#g)" stroke-width="2"/>
    <circle cx="82" cy="-8" r="20" fill="none" stroke="url(#g)" stroke-width="2"/>
    <circle cx="95" cy="12" r="18" fill="none" stroke="url(#g)" stroke-width="2"/>
    <circle cx="88" cy="30" r="16" fill="none" stroke="url(#g)" stroke-width="2"/>
    <circle cx="2" cy="28" r="15" fill="none" stroke="url(#g)" stroke-width="2"/>
    <ellipse cx="48" cy="10" rx="40" ry="22" fill="white"/>

    <!-- Sync arrows -->
    <g transform="translate(48, 8)" filter="url(#glow)">
      <ellipse cx="0" cy="0" rx="18" ry="18" fill="none" stroke="#E0E7FF" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
      <path d="M -2,-17 A 17,17 0 0,1 15,7" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>
      <polygon points="15,7 9,0 16,2" fill="#6C63FF"/>
      <path d="M 2,17 A 17,17 0 0,1 -15,-7" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>
      <polygon points="-15,-7 -9,0 -16,-2" fill="#6C63FF"/>
      <circle cx="0" cy="0" r="2" fill="#7C3AED" opacity="0.5"/>
      <circle cx="0" cy="0" r="4" fill="url(#dg)" opacity="0.3"/>
    </g>
  </g>

  <!-- ===== TEXT ===== -->
  <text x="120" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="50" font-weight="800" fill="#1E1B4B" letter-spacing="-1.5">
    Ai<tspan fill="url(#g)">Syncing</tspan>
  </text>

  <!-- Tagline -->
  <text x="124" y="86" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#6B7280" font-weight="400" letter-spacing="0.3">
    backup your AI memories while you're not thinking about it
  </text>

  <!-- Accent bar under tagline -->
  <rect x="120" y="94" width="90" height="2.5" rx="1.25" fill="url(#g)" opacity="0.35"/>
</svg>
