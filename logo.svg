<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="200" height="180">
  <!-- Thought bubble trailing dots (the "thinking" part) -->
  <circle cx="62" cy="148" r="6" fill="#6C63FF" opacity="0.5"/>
  <circle cx="50" cy="162" r="4" fill="#6C63FF" opacity="0.35"/>

  <!-- Thought bubble cloud -->
  <g>
    <ellipse cx="105" cy="72" rx="62" ry="48" fill="#6C63FF" opacity="0.12"/>
    <ellipse cx="105" cy="72" rx="62" ry="48" fill="none" stroke="#6C63FF" stroke-width="2.5"/>
    <!-- bumps -->
    <circle cx="55" cy="60" r="22" fill="white" stroke="#6C63FF" stroke-width="2.5"/>
    <circle cx="80" cy="35" r="24" fill="white" stroke="#6C63FF" stroke-width="2.5"/>
    <circle cx="115" cy="28" r="26" fill="white" stroke="#6C63FF" stroke-width="2.5"/>
    <circle cx="148" cy="38" r="22" fill="white" stroke="#6C63FF" stroke-width="2.5"/>
    <circle cx="160" cy="62" r="20" fill="white" stroke="#6C63FF" stroke-width="2.5"/>
    <circle cx="152" cy="88" r="18" fill="white" stroke="#6C63FF" stroke-width="2.5"/>
    <circle cx="58" cy="85" r="18" fill="white" stroke="#6C63FF" stroke-width="2.5"/>
    <!-- fill interior to cover inner stroke lines -->
    <ellipse cx="105" cy="65" rx="52" ry="36" fill="white"/>
  </g>

  <!-- Sync arrows (the "syncing" part) — circular refresh icon inside the bubble -->
  <g transform="translate(105,65)" fill="none" stroke="#6C63FF" stroke-width="3.5" stroke-linecap="round">
    <!-- top arc (clockwise arrow) -->
    <path d="M -2,-22 A 22,22 0 0,1 20,8" />
    <polygon points="20,8 14,0 22,2" fill="#6C63FF" stroke="none"/>
    <!-- bottom arc (counter-clockwise arrow) -->
    <path d="M 2,22 A 22,22 0 0,1 -20,-8" />
    <polygon points="-20,-8 -14,0 -22,-2" fill="#6C63FF" stroke="none"/>
  </g>

  <!-- Small sparkle dots — the "AI" touch -->
  <circle cx="78" cy="48" r="2.5" fill="#6C63FF" opacity="0.4"/>
  <circle cx="138" cy="50" r="2" fill="#6C63FF" opacity="0.35"/>
  <circle cx="90" cy="85" r="2" fill="#6C63FF" opacity="0.3"/>
</svg>
