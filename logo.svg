<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <!-- gradient for the thought bubble -->
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <!-- glow for sync arrows -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- subtle shadow for the bubble -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#4F46E5" flood-opacity="0.25"/>
    </filter>
    <!-- orbiting dot gradient -->
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background decorative elements -->
  <!-- Floating particles -->
  <circle cx="30" cy="40" r="3" fill="#A78BFA" opacity="0.3"/>
  <circle cx="70" cy="160" r="2" fill="#6C63FF" opacity="0.25"/>
  <circle cx="180" cy="25" r="2.5" fill="#818CF8" opacity="0.2"/>
  <circle cx="290" cy="175" r="2" fill="#A78BFA" opacity="0.2"/>
  <circle cx="520" cy="30" r="3" fill="#6C63FF" opacity="0.15"/>
  <circle cx="680" cy="45" r="2" fill="#A78BFA" opacity="0.2"/>
  <circle cx="750" cy="155" r="2.5" fill="#818CF8" opacity="0.18"/>
  <circle cx="610" cy="170" r="2" fill="#7C3AED" opacity="0.15"/>

  <!-- Decorative connection lines (subtle neural net vibe) -->
  <line x1="30" y1="40" x2="70" y2="160" stroke="#A78BFA" stroke-width="0.5" opacity="0.1"/>
  <line x1="180" y1="25" x2="120" y2="80" stroke="#818CF8" stroke-width="0.5" opacity="0.1"/>
  <line x1="680" y1="45" x2="750" y2="155" stroke="#A78BFA" stroke-width="0.5" opacity="0.08"/>

  <!-- ==================== THOUGHT BUBBLE ==================== -->
  <g filter="url(#shadow)">
    <!-- Trailing thought dots -->
    <circle cx="52" cy="155" r="7" fill="url(#bubbleGrad)" opacity="0.5"/>
    <circle cx="38" cy="172" r="4.5" fill="url(#bubbleGrad)" opacity="0.35"/>

    <!-- Cloud body - overlapping circles -->
    <circle cx="72" cy="100" r="28" fill="white"/>
    <circle cx="100" cy="72" r="32" fill="white"/>
    <circle cx="138" cy="62" r="36" fill="white"/>
    <circle cx="176" cy="68" r="30" fill="white"/>
    <circle cx="195" cy="95" r="26" fill="white"/>
    <circle cx="185" cy="120" r="24" fill="white"/>
    <circle cx="72" cy="120" r="22" fill="white"/>
    <!-- Fill center -->
    <ellipse cx="133" cy="95" rx="60" ry="35" fill="white"/>

    <!-- Cloud outline -->
    <circle cx="72" cy="100" r="28" fill="none" stroke="url(#bubbleGrad)" stroke-width="2.5"/>
    <circle cx="100" cy="72" r="32" fill="none" stroke="url(#bubbleGrad)" stroke-width="2.5"/>
    <circle cx="138" cy="62" r="36" fill="none" stroke="url(#bubbleGrad)" stroke-width="2.5"/>
    <circle cx="176" cy="68" r="30" fill="none" stroke="url(#bubbleGrad)" stroke-width="2.5"/>
    <circle cx="195" cy="95" r="26" fill="none" stroke="url(#bubbleGrad)" stroke-width="2.5"/>
    <circle cx="185" cy="120" r="24" fill="none" stroke="url(#bubbleGrad)" stroke-width="2.5"/>
    <circle cx="72" cy="120" r="22" fill="none" stroke="url(#bubbleGrad)" stroke-width="2.5"/>
    <!-- Cover interior lines -->
    <ellipse cx="133" cy="95" rx="58" ry="33" fill="white"/>
  </g>

  <!-- ==================== SYNC ARROWS (inside bubble) ==================== -->
  <g transform="translate(133,92)" filter="url(#glow)">
    <!-- Orbital ring (subtle) -->
    <ellipse cx="0" cy="0" rx="28" ry="28" fill="none" stroke="#E0E7FF" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5"/>

    <!-- Top arc arrow -->
    <path d="M -4,-26 A 26,26 0 0,1 23,10" fill="none" stroke="url(#bubbleGrad)" stroke-width="4" stroke-linecap="round"/>
    <polygon points="23,10 15,1 24,3" fill="#6C63FF"/>

    <!-- Bottom arc arrow -->
    <path d="M 4,26 A 26,26 0 0,1 -23,-10" fill="none" stroke="url(#bubbleGrad)" stroke-width="4" stroke-linecap="round"/>
    <polygon points="-23,-10 -15,-1 -24,-3" fill="#6C63FF"/>

    <!-- Center sparkle -->
    <circle cx="0" cy="0" r="3" fill="#7C3AED" opacity="0.6"/>
    <circle cx="0" cy="0" r="6" fill="url(#dotGlow)" opacity="0.4"/>
  </g>

  <!-- Orbiting dots around sync icon -->
  <circle cx="110" cy="70" r="3" fill="#A78BFA" opacity="0.6"/>
  <circle cx="160" cy="118" r="2.5" fill="#818CF8" opacity="0.5"/>
  <circle cx="108" cy="110" r="2" fill="#C4B5FD" opacity="0.5"/>

  <!-- ==================== TEXT ==================== -->
  <g transform="translate(250, 0)">
    <!-- Main title -->
    <text x="0" y="95" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#1E1B4B" letter-spacing="-2">
      Ai<tspan fill="url(#bubbleGrad)">Syncing</tspan>
    </text>

    <!-- Tagline -->
    <text x="4" y="128" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#6B7280" font-weight="400" letter-spacing="0.5">
      backup your AI memories while you're not thinking about it
    </text>

    <!-- Decorative underline accent -->
    <rect x="0" y="138" width="120" height="3" rx="1.5" fill="url(#bubbleGrad)" opacity="0.4"/>
  </g>
</svg>
